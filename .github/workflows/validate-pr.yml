name: Validation PR

on:
  pull_request:
    branches: [dev]

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Build de vérification
        run: npm run build

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validation du schéma des données
        run: |
          pip install jsonschema
          python scripts/validate_schema.py

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bump SemVer (label release:* de la PR mergée)
        id: semver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bump_version.py

      - name: Commit version + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): v${{ steps.semver.outputs.new_version }} [skip ci]"
          git tag "v${{ steps.semver.outputs.new_version }}" 2>/dev/null || echo "tag déjà existant"
          git push origin main --tags

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

      - name: Artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Déploiement GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.semver.outputs.new_version }}" --title "v${{ steps.semver.outputs.new_version }}" --generate-notes || echo "release déjà existante"
